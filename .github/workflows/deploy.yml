# ============================================================
# PChat 部署流水线（v1.0 起唯一部署入口）
# ------------------------------------------------------------
# 顺序固定：checkout → setup-node → npm ci → 应用 D1 迁移 → 构建 → Direct Upload 部署
#
# 行为约定（重要）：
#   - 未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 时，preflight 会判定「跳过」，
#     整个工作流以**成功**结束、deploy 作业显示为 skipped（灰色，不会有红叉）。
#     这样上游仓库（作者不用 Actions 部署）保持安静，fork 的人配好 Secrets 后自动生效。
#   - 只配了 ACCOUNT_ID + API_TOKEN：正常部署，但迁移步骤**跳过并警告**（第一次部署，确认连通性）。
#   - 再补 D1_DATABASE_ID：迁移执行，账本 d1_migrations 建立，登录恢复正常。
#
# 使用者（fork 后）：
#   1) Actions 页面点击启用 workflows；
#   2) Settings → Secrets and variables → Actions 添加：
#        CLOUDFLARE_ACCOUNT_ID、CLOUDFLARE_API_TOKEN
#        需要初始化数据库时再加：D1_DATABASE_ID
#      （可选 Variable: PAGES_PROJECT_NAME，默认 pchat）
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个部署；取消进行中的任务可能打断迁移，所以不取消
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # 预检：只判断「能不能部署」，缺 Secrets 时安静跳过（不失败）
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: 检查是否具备部署凭据
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${TOKEN:-}" ]   || missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -n "${ACCOUNT:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::跳过部署：未配置 Secrets:${missing}。这是预期行为（普通使用者配置后会自动部署）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 已跳过部署";
              echo "";
              echo "未配置 Secrets:${missing}。";
              echo "在 Settings → Secrets and variables → Actions 添加后，本工作流会自动执行部署。";
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'pchat' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖（wrangler 精确锁定在 devDependencies）
        run: npm ci

      # ---------- 1) 数据库迁移（缺 D1_DATABASE_ID 时跳过，见文件头「两次部署」） ----------
      - name: 应用 D1 迁移
        if: ${{ env.D1_DATABASE_ID != '' }}
        run: |
          set -euo pipefail
          echo "生成迁移用临时配置（真实 database_id 来自 Secret，不入库）"
          sed -e "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${D1_DATABASE_ID}|" \
              wrangler.example.toml > .wrangler-ci.toml
          npx wrangler --version
          echo "待应用的迁移："
          npx wrangler d1 migrations list DB --remote --config .wrangler-ci.toml
          npx wrangler d1 migrations apply DB --remote --force --config .wrangler-ci.toml
          {
            echo "### D1 迁移";
            echo "账本：\`d1_migrations\`（由 Wrangler 托管）";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 跳过迁移（首次部署）
        if: ${{ env.D1_DATABASE_ID == '' }}
        run: |
          echo "::warning::未配置 Secret D1_DATABASE_ID，本次跳过数据库迁移，仅部署应用。"
          echo "::warning::这是首次部署的预期状态：站点可打开、接口已连通，但登录会因缺少数据表而报错。"
          echo "::warning::在 Settings → Secrets and variables → Actions 添加 D1_DATABASE_ID 后重新运行，即完成数据结构初始化。"
          {
            echo "### 数据结构尚未初始化";
            echo "";
            echo "缺少 Secret \`D1_DATABASE_ID\`，已跳过 \`wrangler d1 migrations apply\`。";
            echo "补上该 Secret 后重新运行本工作流即可建表。";
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 2) 构建（静态资源自检，不做迁移） ----------
      - name: 构建
        run: npm run build

      # ---------- 3) Direct Upload 部署（预构建产物） ----------
      - name: 部署到 Cloudflare Pages
        run: |
          set -euo pipefail
          npx wrangler pages deploy static \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch main
          {
            echo "### 部署";
            echo "项目：\`$PAGES_PROJECT_NAME\`（Direct Upload）";
          } >> "$GITHUB_STEP_SUMMARY"
